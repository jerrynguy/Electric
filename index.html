<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mạch Điện Lab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 12h5l2-5 3 10 3-10 2 5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Mạch Điện Lab</div>
  <div class="tools">
    <button data-mode="select" class="on" title="Chọn / kéo (V)">↖ Chọn</button>
    <button data-mode="wire" title="Vẽ dây (W)">╱ Dây</button>
    <span class="sep"></span>
    <button id="btnRot" title="Xoay (R)">⟳ Xoay</button>
    <button id="btnFlip" title="Lật (F)">⇅ Lật</button>
    <button id="btnDel" title="Xoá (Delete)">✕ Xoá</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Hoàn tác (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Làm lại (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <select id="exSelect" title="Mạch ví dụ"><option value="">📘 Ví dụ (đề thi)…</option></select>
    <button id="btnNew" title="Mạch mới">Mới</button>
    <button id="btnSave" title="Lưu ra file">Lưu</button>
    <button id="btnOpen" title="Mở file">Mở</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button id="btnHelp" title="Hướng dẫn & công thức">? Công thức</button>
  </div>
</header>
<main class="layout">
  <aside class="palette" id="palette"></aside>
  <section class="canvas-wrap">
    <div id="banner" class="banner" hidden></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.1" class="griddot"/><circle cx="20" cy="0" r="1.1" class="griddot"/><circle cx="0" cy="20" r="1.1" class="griddot"/><circle cx="20" cy="20" r="1.1" class="griddot"/></pattern>
      </defs>
      <rect id="gridbg" fill="url(#gridpat)"/>
      <g id="layer"></g>
    </svg>
    <div class="statusbar"><span id="status">Sẵn sàng</span><span id="hover"></span></div>
  </section>
  <aside class="panel">
    <nav class="tabs"><button data-tab="props" class="on">Thuộc tính</button><button data-tab="results">Kết quả</button><button data-tab="tools">Công cụ</button></nav>
    <div class="modebar"><label>Chế độ: <select id="modeSel"></select></label><label class="chk"><input type="checkbox" id="showV" checked> Hiện số liệu trên mạch</label></div>
    <div id="msgs"></div>
    <div class="tab" id="tab-props"></div>
    <div class="tab" id="tab-results" hidden></div>
    <div class="tab" id="tab-tools" hidden></div>
  </aside>
</main>
<div id="help" class="modal" hidden><div class="modal-box"><button class="close" id="helpClose">✕</button><div id="helpBody"></div></div></div>
<script src="js/units.js"></script>
<script src="js/solver.js"></script>
<script src="js/components.js"></script>
<script src="js/netlist.js"></script>
<script src="js/tools.js"></script>
<script src="js/examples.js"></script>
<script src="js/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
