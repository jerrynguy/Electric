<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mạch Điện Lab</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #f0f2f5; --border: #d9dde3; --text: #1d2430; --muted: #657083;
  --accent: #2563eb; --accent-soft: #dbe7ff; --wire: #334155; --comp: #1e293b; --sel: #f97316; --grid: #c8cdd6;
  --volt: #0f766e; --volt-bg: #e6f6f4; --cur: #b45309; --err: #b91c1c; --err-bg: #fdecec; --warn: #92400e; --warn-bg: #fff6e0;
  --pin-free: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface2: #1e2430; --border: #2c3442; --text: #e5e9f0; --muted: #94a0b4;
    --accent: #60a5fa; --accent-soft: #1e3a5f; --wire: #a8b3c4; --comp: #e2e8f0; --sel: #fb923c; --grid: #2f3846;
    --volt: #5eead4; --volt-bg: #0f2e2b; --cur: #fbbf24; --err: #fca5a5; --err-bg: #3b1616; --warn: #fcd34d; --warn-bg: #3a2c0c;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface2: #1e2430; --border: #2c3442; --text: #e5e9f0; --muted: #94a0b4;
  --accent: #60a5fa; --accent-soft: #1e3a5f; --wire: #a8b3c4; --comp: #e2e8f0; --sel: #fb923c; --grid: #2f3846;
  --volt: #5eead4; --volt-bg: #0f2e2b; --cur: #fbbf24; --err: #fca5a5; --err-bg: #3b1616; --warn: #fcd34d; --warn-bg: #3a2c0c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
select, input[type=text], input[type=number] { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input[type=text]:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--accent); }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

.layout { flex: 1; display: grid; grid-template-columns: 150px 1fr 340px; min-height: 0; }
.palette { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; }
.palette h4 { margin: 10px 2px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.palette button { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 4px; padding: 4px 6px; text-align: left; font-size: 13px; }
.palette svg { width: 34px; height: 22px; flex: none; }
.palette svg * { fill: none; stroke: var(--comp); stroke-width: 2.4; }
.palette svg .fill { fill: var(--comp); }
.palette svg .thick { stroke-width: 5; }

.canvas-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#canvas { flex: 1; width: 100%; display: block; touch-action: none; user-select: none; background: var(--bg); }
.griddot { fill: var(--grid); }
.statusbar { display: flex; justify-content: space-between; gap: 12px; padding: 4px 10px; font-size: 12px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--border); }
#hover { color: var(--volt); font-weight: 600; }
.banner { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 2; background: var(--surface); border: 1px solid var(--accent); border-left-width: 4px; border-radius: 6px; padding: 8px 32px 8px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.banner .x { position: absolute; right: 6px; top: 6px; padding: 0 6px; }

/* SVG */
.comp .sym * { fill: none; stroke: var(--comp); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.comp .sym .fill { fill: var(--comp); }
.comp .sym .thick { stroke-width: 4.5; }
.comp .sym .thin { stroke-width: 1.5; }
.comp .sym .pin-o { fill: var(--bg); }
.comp .hit { fill: transparent; stroke: none; cursor: move; }
.comp.sel .sym * { stroke: var(--sel); }
.comp.sel .sym .fill { fill: var(--sel); }
.comp.ghost { opacity: .5; pointer-events: none; }
.clabel { font-size: 12px; fill: var(--text); pointer-events: none; }
.clabel .nm { font-weight: 700; }
.clabel .vl { fill: var(--muted); }
.clabel .rs { fill: var(--cur); font-weight: 600; }
.wire line.w { stroke: var(--wire); stroke-width: 2; stroke-linecap: round; }
.wire line.hit { stroke: transparent; stroke-width: 12; cursor: pointer; }
.wire.sel line.w { stroke: var(--sel); stroke-width: 3; }
.wire.preview line.w { stroke: var(--accent); stroke-dasharray: 5 4; }
.junc { fill: var(--wire); }
.freepin { fill: none; stroke: var(--pin-free); stroke-width: 1.5; }
.cursor-dot { fill: var(--accent); opacity: .7; }
.vtag rect { fill: var(--volt-bg); stroke: var(--volt); stroke-width: 1; }
.vtag text { fill: var(--volt); font-size: 11.5px; font-weight: 600; }
.ltag rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.ltag text { fill: var(--accent); font-size: 12px; font-weight: 700; }
.ltag line { stroke: var(--accent); stroke-width: 1.5; }
.state-tag { font-size: 11px; font-weight: 600; fill: var(--accent); }

/* Panel */
.panel { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 9px 4px; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }
.modebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.chk { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.tab { overflow-y: auto; padding: 10px 12px 24px; flex: 1; min-height: 0; }
.msg { margin: 6px 12px 0; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; }
.msg.err { background: var(--err-bg); color: var(--err); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }
h3 { margin: 4px 0 8px; font-size: 15px; }
h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field { display: grid; grid-template-columns: 1fr 120px; gap: 6px; align-items: center; margin-bottom: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field input[type=text] { width: 100%; }
.field.bad input { border-color: var(--err); }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface2); }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.explain { background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.explain div { margin: 3px 0; }
.explain b { color: var(--accent); }
.big { font-size: 18px; font-weight: 700; color: var(--accent); }
.tool-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.tool-box .field { grid-template-columns: 110px 1fr; }
.tool-box select, .tool-box input[type=text] { width: 100%; }
.chart { width: 100%; height: 180px; display: block; margin-top: 8px; }
.chart .ax { stroke: var(--muted); fill: none; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .tr { stroke: var(--sel); stroke-dasharray: 4 3; }
.chart text { font-size: 10px; fill: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { position: relative; background: var(--surface); border-radius: 10px; max-width: 760px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px 22px; }
.modal-box .close { position: absolute; top: 10px; right: 10px; }
.modal-box h2 { margin-top: 0; }
.modal-box h3 { margin-top: 18px; color: var(--accent); }
.modal-box code, .f { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.modal-box li { margin: 3px 0; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  .palette { display: flex; gap: 4px; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 6px 16px; }
  .palette h4 { display: none; }
  .palette button { width: auto; margin: 0; flex: none; }
  .panel { border-left: none; border-top: 1px solid var(--border); }
  .tab { overflow: visible; }
  .topbar { padding: 8px 16px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 12h5l2-5 3 10 3-10 2 5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Mạch Điện Lab</div>
  <div class="tools">
    <button data-mode="select" class="on" title="Chọn / kéo (V)">↖ Chọn</button>
    <button data-mode="wire" title="Vẽ dây (W)">╱ Dây</button>
    <span class="sep"></span>
    <button id="btnRot" title="Xoay (R)">⟳ Xoay</button>
    <button id="btnFlip" title="Lật (F)">⇅ Lật</button>
    <button id="btnDel" title="Xoá (Delete)">✕ Xoá</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Hoàn tác (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Làm lại (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <select id="exSelect" title="Mạch ví dụ"><option value="">📘 Ví dụ (đề thi)…</option></select>
    <button id="btnNew" title="Mạch mới">Mới</button>
    <button id="btnSave" title="Lưu ra file">Lưu</button>
    <button id="btnOpen" title="Mở file">Mở</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button id="btnHelp" title="Hướng dẫn & công thức">? Công thức</button>
  </div>
</header>
<main class="layout">
  <aside class="palette" id="palette"></aside>
  <section class="canvas-wrap">
    <div id="banner" class="banner" hidden></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.1" class="griddot"/><circle cx="20" cy="0" r="1.1" class="griddot"/><circle cx="0" cy="20" r="1.1" class="griddot"/><circle cx="20" cy="20" r="1.1" class="griddot"/></pattern>
      </defs>
      <rect id="gridbg" fill="url(#gridpat)"/>
      <g id="layer"></g>
    </svg>
    <div class="statusbar"><span id="status">Sẵn sàng</span><span id="hover"></span></div>
  </section>
  <aside class="panel">
    <nav class="tabs"><button data-tab="props" class="on">Thuộc tính</button><button data-tab="results">Kết quả</button><button data-tab="tools">Công cụ</button></nav>
    <div class="modebar"><label>Chế độ: <select id="modeSel"></select></label><label class="chk"><input type="checkbox" id="showV" checked> Hiện số liệu trên mạch</label></div>
    <div id="msgs"></div>
    <div class="tab" id="tab-props"></div>
    <div class="tab" id="tab-results" hidden></div>
    <div class="tab" id="tab-tools" hidden></div>
  </aside>
</main>
<div id="help" class="modal" hidden><div class="modal-box"><button class="close" id="helpClose">✕</button><div id="helpBody"></div></div></div>
<script>
/* Đọc / hiển thị giá trị có tiền tố SI (k, m, µ, ...) */
(function () {
  'use strict';
  const EC = (globalThis.EC = globalThis.EC || {});
  const PREFIX = { T: 1e12, G: 1e9, M: 1e6, meg: 1e6, k: 1e3, K: 1e3, m: 1e-3, u: 1e-6, 'µ': 1e-6, 'μ': 1e-6, n: 1e-9, p: 1e-12 };

  function parseValue(str) {
    if (typeof str === 'number') return str;
    if (str == null) return NaN;
    const s = String(str).trim().replace(/,/g, '.').replace(/\s+/g, '');
    if (!s) return NaN;
    const m = s.match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)(meg|[TGMkKmuµμnp])?([a-zA-ZΩ°]*)$/);
    if (!m) return NaN;
    let v = parseFloat(m[1]);
    if (m[2]) v *= PREFIX[m[2]];
    return v;
  }

  const STEPS = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];

  function num(x, digits) {
    let s = x.toPrecision(digits);
    if (s.indexOf('e') < 0 && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function fmt(v, unit, digits) {
    unit = unit || '';
    digits = digits || 4;
    if (typeof v !== 'number' || !isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a < 1e-13) return '0 ' + unit;
    for (let i = 0; i < STEPS.length; i++) {
      const f = STEPS[i][0];
      if (a >= f * (1 - 5e-5) || i === STEPS.length - 1) {
        let s = num(v / f, digits);
        if (Math.abs(parseFloat(s)) >= 1000 && i > 0) s = num(v / STEPS[i - 1][0], digits), i = i - 1;
        return s + ' ' + STEPS[i][1] + unit;
      }
    }
    return v.toExponential(3) + ' ' + unit;
  }

  function fmtDeg(d) {
    if (!isFinite(d)) return '—';
    return num(Math.abs(d) < 5e-4 ? 0 : d, 4) + '°';
  }

  /* Số phức dạng {re, im} -> "12.3 V ∠ -45°" */
  function fmtC(c, unit, digits) {
    const mag = Math.hypot(c.re, c.im);
    if (mag < 1e-13) return '0 ' + (unit || '');
    return fmt(mag, unit, digits) + ' ∠ ' + fmtDeg((Math.atan2(c.im, c.re) * 180) / Math.PI);
  }

  function fmtRect(c, unit) {
    const s = c.im < 0 ? ' − j' : ' + j';
    return num(c.re, 4) + s + num(Math.abs(c.im), 4) + (unit ? ' ' + unit : '');
  }

  EC.units = { parseValue, fmt, fmtC, fmtDeg, fmtRect, num };
})();
</script>
<script>
/*
 * Bộ giải mạch theo phương pháp nút cải tiến (Modified Nodal Analysis - MNA).
 *  - DC: nguồn DC, tụ hở mạch, cuộn cảm ngắn mạch.
 *  - AC: phasor hiệu dụng (RMS) tại tần số của nguồn AC, nguồn DC = 0.
 *  - Linh kiện phi tuyến dùng mô hình tuyến tính từng đoạn giống sách giáo khoa:
 *      Diode: dẫn (sụt áp Vf) / tắt.
 *      Zener: dẫn thuận / đánh thủng (Vz) / tắt.
 *      BJT: ngưng dẫn / khuếch đại (IC = β·IB, VBE) / bão hòa (VCE = VCE(sat)).
 *      Op-amp lý tưởng: tuyến tính (V+ = V−) / bão hòa dương / bão hòa âm.
 *    Trạng thái được tìm bằng cách lặp "giả sử – kiểm tra" cho tới khi nhất quán.
 */
(function () {
  'use strict';
  const EC = (globalThis.EC = globalThis.EC || {});
  const GMIN = 1e-12; // điện dẫn rất nhỏ từ mỗi nút xuống đất để tránh nút "lơ lửng"
  const RS = 1e-6; // điện trở nối tiếp rất nhỏ của diode/BJT để tránh vòng nguồn áp
  const BR = 1000000;
  const EPS_I = 1e-12, EPS_V = 1e-9;

  const cx = (re, im) => ({ re, im: im || 0 });
  const csub = (a, b) => cx(a.re - b.re, a.im - b.im);
  const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
  const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return cx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const cscale = (a, k) => cx(a.re * k, a.im * k);
  const cabs = (a) => Math.hypot(a.re, a.im);
  const polar = (mag, deg) => cx(mag * Math.cos((deg * Math.PI) / 180), mag * Math.sin((deg * Math.PI) / 180));

  class CircuitError extends Error {}

  class Sys {
    constructor(nn) { this.nn = nn; this.nb = 0; this.ent = []; this.rhs = []; }
    add(r, c, re, im) { if (r < 0 || c < 0) return; this.ent.push(r, c, re, im || 0); }
    addR(r, re, im) { if (r < 0) return; this.rhs.push(r, re, im || 0); }
    admit(a, b, re, im) {
      im = im || 0; const i = a - 1, j = b - 1;
      this.add(i, i, re, im); this.add(j, j, re, im); this.add(i, j, -re, -im); this.add(j, i, -re, -im);
    }
    /* Nhánh nguồn áp: V(a) − V(b) − Z·I = v ; I chảy từ a qua phần tử sang b */
    vsrc(a, b, vre, vim, zre, zim) {
      const k = BR + this.nb++, i = a - 1, j = b - 1;
      this.add(i, k, 1); this.add(j, k, -1); this.add(k, i, 1); this.add(k, j, -1);
      if (zre || zim) this.add(k, k, -(zre || 0), -(zim || 0));
      this.addR(k, vre || 0, vim || 0);
      return k;
    }
    /* Nguồn dòng: dòng I chảy từ a qua phần tử sang b (đẩy ra ở chân b) */
    isrc(a, b, ire, iim) { this.addR(a - 1, -ire, -(iim || 0)); this.addR(b - 1, ire, iim || 0); }
    cccs(k, c, e, beta) { this.add(c - 1, k, beta); this.add(e - 1, k, -beta); }
    opampLin(p, m, out) {
      const k = BR + this.nb++;
      this.add(out - 1, k, 1); this.add(k, p - 1, 1); this.add(k, m - 1, -1);
      return k;
    }
    solve() {
      const nn = this.nn, N = nn - 1 + this.nb;
      const map = (i) => (i >= BR ? nn - 1 + (i - BR) : i);
      const Ar = new Float64Array(N * N), Ai = new Float64Array(N * N);
      const br = new Float64Array(N), bi = new Float64Array(N);
      for (let i = 0; i < nn - 1; i++) Ar[i * N + i] += GMIN;
      const e = this.ent;
      for (let t = 0; t < e.length; t += 4) { const r = map(e[t]), c = map(e[t + 1]); Ar[r * N + c] += e[t + 2]; Ai[r * N + c] += e[t + 3]; }
      const h = this.rhs;
      for (let t = 0; t < h.length; t += 3) { const r = map(h[t]); br[r] += h[t + 1]; bi[r] += h[t + 2]; }
      for (let k = 0; k < N; k++) {
        let p = k, best = -1;
        for (let i = k; i < N; i++) { const m = Math.abs(Ar[i * N + k]) + Math.abs(Ai[i * N + k]); if (m > best) { best = m; p = i; } }
        if (best < 1e-14) throw new CircuitError('singular');
        if (p !== k) {
          for (let j = 0; j < N; j++) {
            let t = Ar[k * N + j]; Ar[k * N + j] = Ar[p * N + j]; Ar[p * N + j] = t;
            t = Ai[k * N + j]; Ai[k * N + j] = Ai[p * N + j]; Ai[p * N + j] = t;
          }
          let t = br[k]; br[k] = br[p]; br[p] = t; t = bi[k]; bi[k] = bi[p]; bi[p] = t;
        }
        const pr = Ar[k * N + k], pi = Ai[k * N + k], d = pr * pr + pi * pi;
        for (let i = k + 1; i < N; i++) {
          const ar = Ar[i * N + k], ai = Ai[i * N + k];
          if (ar === 0 && ai === 0) continue;
          const fr = (ar * pr + ai * pi) / d, fi = (ai * pr - ar * pi) / d;
          for (let j = k; j < N; j++) {
            const xr = Ar[k * N + j], xi = Ai[k * N + j];
            if (xr === 0 && xi === 0) continue;
            Ar[i * N + j] -= fr * xr - fi * xi; Ai[i * N + j] -= fr * xi + fi * xr;
          }
          const yr = br[k], yi = bi[k];
          br[i] -= fr * yr - fi * yi; bi[i] -= fr * yi + fi * yr;
        }
      }
      const xr = new Float64Array(N), xi = new Float64Array(N);
      for (let i = N - 1; i >= 0; i--) {
        let sr = br[i], si = bi[i];
        for (let j = i + 1; j < N; j++) {
          const ar = Ar[i * N + j], ai = Ai[i * N + j];
          sr -= ar * xr[j] - ai * xi[j]; si -= ar * xi[j] + ai * xr[j];
        }
        const pr = Ar[i * N + i], pi = Ai[i * N + i], d = pr * pr + pi * pi;
        xr[i] = (sr * pr + si * pi) / d; xi[i] = (si * pr - sr * pi) / d;
      }
      return {
        V: (n) => (n <= 0 ? cx(0) : cx(xr[n - 1], xi[n - 1])),
        I: (k) => cx(xr[map(k)], xi[map(k)]),
        Vd(a, b) { return csub(this.V(a), this.V(b)); },
        nodeCount: nn,
      };
    }
  }

  /* ---------- Mô tả từng loại linh kiện ---------- */
  const two = (q) => q; // tiện ích đặt tên
  function acSource(e, ctx) {
    if (!ctx.ac || Math.abs(ctx.freq - e.p.f) > 1e-9) return cx(0);
    return polar(e.p.V !== undefined ? e.p.V : e.p.I, e.p.ph || 0);
  }

  const DEV = {
    R: {
      stamp(s, e) { const [a, b] = e.nodes; if (Math.abs(e.p.R) < 1e-12) return { k: s.vsrc(a, b, 0) }; s.admit(a, b, 1 / e.p.R); return {}; },
      res(sol, e, info) { const [a, b] = e.nodes; const U = sol.Vd(a, b); return two({ U, I: info.k != null ? sol.I(info.k) : cscale(U, 1 / e.p.R) }); },
    },
    C: {
      stamp(s, e, ctx) { if (ctx.ac) s.admit(e.nodes[0], e.nodes[1], 0, ctx.omega * e.p.C); return {}; },
      res(sol, e, info, ctx) { const U = sol.Vd(e.nodes[0], e.nodes[1]); return { U, I: ctx.ac ? cmul(U, cx(0, ctx.omega * e.p.C)) : cx(0) }; },
    },
    L: {
      stamp(s, e, ctx) { return { k: s.vsrc(e.nodes[0], e.nodes[1], 0, 0, 0, ctx.ac ? ctx.omega * e.p.L : 0) }; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: sol.I(info.k) }; },
    },
    Z: {
      stamp(s, e, ctx) {
        const [a, b] = e.nodes; const z = ctx.ac ? cx(e.p.R, e.p.X) : cx(e.p.R);
        if (cabs(z) < 1e-12) return { k: s.vsrc(a, b, 0) };
        const y = cdiv(cx(1), z); s.admit(a, b, y.re, y.im); return { y };
      },
      res(sol, e, info) { const U = sol.Vd(e.nodes[0], e.nodes[1]); return { U, I: info.k != null ? sol.I(info.k) : cmul(U, info.y) }; },
    },
    SW: {
      stamp(s, e) { return e.p.closed ? { k: s.vsrc(e.nodes[0], e.nodes[1], 0) } : {}; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: info.k != null ? sol.I(info.k) : cx(0) }; },
    },
    V: {
      stamp(s, e, ctx) { return { k: s.vsrc(e.nodes[0], e.nodes[1], ctx.ac ? 0 : e.p.V) }; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: sol.I(info.k) }; },
    },
    ACV: {
      stamp(s, e, ctx) { const v = acSource(e, ctx); return { k: s.vsrc(e.nodes[0], e.nodes[1], v.re, v.im) }; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: sol.I(info.k) }; },
    },
    I: {
      stamp(s, e, ctx) { if (!ctx.ac) s.isrc(e.nodes[0], e.nodes[1], e.p.I); return {}; },
      res(sol, e, info, ctx) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: cx(ctx.ac ? 0 : e.p.I) }; },
    },
    ACI: {
      stamp(s, e, ctx) { const i = acSource(e, ctx); s.isrc(e.nodes[0], e.nodes[1], i.re, i.im); return { i }; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: info.i }; },
    },
    D: {
      states: ['off', 'on'], init: 'off',
      stamp(s, e, ctx, st) { return st === 'on' ? { k: s.vsrc(e.nodes[0], e.nodes[1], ctx.ac ? 0 : e.p.Vf, 0, RS) } : {}; },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: info.k != null ? sol.I(info.k) : cx(0) }; },
      check(sol, e, info, st) {
        if (st === 'on') return sol.I(info.k).re < -EPS_I ? 'off' : null;
        return sol.Vd(e.nodes[0], e.nodes[1]).re > e.p.Vf + EPS_V ? 'on' : null;
      },
    },
    ZD: {
      states: ['off', 'fwd', 'bd'], init: 'off',
      stamp(s, e, ctx, st) {
        if (st === 'fwd') return { k: s.vsrc(e.nodes[0], e.nodes[1], ctx.ac ? 0 : e.p.Vf, 0, RS) };
        if (st === 'bd') return { k: s.vsrc(e.nodes[0], e.nodes[1], ctx.ac ? 0 : -e.p.Vz, 0, RS) };
        return {};
      },
      res(sol, e, info) { return { U: sol.Vd(e.nodes[0], e.nodes[1]), I: info.k != null ? sol.I(info.k) : cx(0) }; },
      check(sol, e, info, st) {
        if (st === 'fwd') return sol.I(info.k).re < -EPS_I ? 'off' : null;
        if (st === 'bd') return sol.I(info.k).re > EPS_I ? 'off' : null;
        const v = sol.Vd(e.nodes[0], e.nodes[1]).re;
        if (v > e.p.Vf + EPS_V) return 'fwd';
        if (v < -e.p.Vz - EPS_V) return 'bd';
        return null;
      },
    },
    NPN: null, PNP: null,
    OPAMP: {
      states: ['lin', 'pos', 'neg'], init: 'lin',
      // nodes: [in−, in+, out]
      stamp(s, e, ctx, st) {
        const [m, p, o] = e.nodes;
        if (st === 'lin') return { k: s.opampLin(p, m, o) };
        return { k: s.vsrc(o, 0, ctx.ac ? 0 : st === 'pos' ? e.p.Vpos : e.p.Vneg) };
      },
      res(sol, e, info) {
        const [m, p, o] = e.nodes;
        const Vout = sol.V(o), Vp = sol.V(p), Vm = sol.V(m), Iout = cscale(sol.I(info.k), -1);
        return { Vout, Vp, Vm, Vd: csub(Vp, Vm), Iout, P: -(Vout.re * Iout.re + Vout.im * Iout.im) };
      },
      check(sol, e, info, st) {
        const [m, p, o] = e.nodes;
        if (st === 'lin') { const v = sol.V(o).re; if (v > e.p.Vpos + EPS_V) return 'pos'; if (v < e.p.Vneg - EPS_V) return 'neg'; return null; }
        const vd = sol.V(p).re - sol.V(m).re;
        if (st === 'pos') return vd < -EPS_V ? 'lin' : null;
        return vd > EPS_V ? 'lin' : null;
      },
    },
  };

  function bjt(sign) {
    return {
      states: ['cut', 'act', 'sat'], init: 'act',
      // nodes: [B, C, E]
      stamp(s, e, ctx, st) {
        const [B, C, E] = e.nodes;
        if (st === 'cut') return {};
        const kbe = s.vsrc(B, E, ctx.ac ? 0 : sign * e.p.Vbe, 0, RS);
        if (st === 'act') { s.cccs(kbe, C, E, e.p.beta); return { kbe }; }
        return { kbe, kce: s.vsrc(C, E, ctx.ac ? 0 : sign * e.p.Vcesat, 0, RS) };
      },
      res(sol, e, info, ctx, st) {
        const [B, C, E] = e.nodes;
        let IB = cx(0), IC = cx(0);
        if (st !== 'cut') { IB = sol.I(info.kbe); IC = st === 'act' ? cscale(IB, e.p.beta) : sol.I(info.kce); }
        const VBE = sol.Vd(B, E), VCE = sol.Vd(C, E);
        const P = VBE.re * IB.re + VBE.im * IB.im + VCE.re * IC.re + VCE.im * IC.im;
        // Với PNP hiển thị dòng theo chiều quy ước (chảy ra khỏi B và C) để luôn dương
        const s2 = sign;
        return { VBE, VCE, IB: cscale(IB, s2), IC: cscale(IC, s2), IE: cscale(cadd(IB, IC), s2), P };
      },
      check(sol, e, info, st) {
        const [B, C, E] = e.nodes;
        if (st === 'cut') return sign * sol.Vd(B, E).re > e.p.Vbe + EPS_V ? 'act' : null;
        const ib = sign * sol.I(info.kbe).re;
        if (ib < -EPS_I) return 'cut';
        if (st === 'act') return sign * sol.Vd(C, E).re < e.p.Vcesat - EPS_V ? 'sat' : null;
        const ic = sign * sol.I(info.kce).re;
        if (ic > e.p.beta * ib + EPS_I || ic < -EPS_I) return 'act';
        return null;
      },
    };
  }
  DEV.NPN = bjt(1);
  DEV.PNP = bjt(-1);

  const STATE_NAMES = {
    on: 'Dẫn', off: 'Tắt', fwd: 'Dẫn thuận', bd: 'Đánh thủng (ổn áp)',
    cut: 'Ngưng dẫn', act: 'Khuếch đại (tích cực)', sat: 'Bão hòa',
    lin: 'Tuyến tính', pos: 'Bão hòa dương', neg: 'Bão hòa âm',
  };

  /* ---------- Giải với một tổ hợp trạng thái cố định ---------- */
  function solveFixed(net, ctx, states) {
    const s = new Sys(net.nodeCount);
    const infos = {};
    for (const e of net.elements) infos[e.id] = DEV[e.type].stamp(s, e, ctx, states[e.id]);
    const sol = s.solve();
    return { sol, infos };
  }

  function collect(net, ctx, states, fixed) {
    const { sol, infos } = fixed;
    const nodeV = [];
    for (let n = 0; n < net.nodeCount; n++) nodeV.push(sol.V(n));
    const el = {};
    for (const e of net.elements) {
      const q = DEV[e.type].res(sol, e, infos[e.id], ctx, states[e.id]);
      if (q.U && q.I && q.P === undefined) {
        q.P = q.U.re * q.I.re + q.U.im * q.I.im;
        if (ctx.ac) q.Q = q.U.im * q.I.re - q.U.re * q.I.im;
      }
      el[e.id] = { q, state: states[e.id] || null };
    }
    return { nodeV, el, states: Object.assign({}, states), ctx };
  }

  function solveDC(net, warnings) {
    const ctx = { ac: false, freq: 0, omega: 0 };
    const nl = net.elements.filter((e) => DEV[e.type].states);
    const states = {};
    nl.forEach((e) => (states[e.id] = (e.initState) || DEV[e.type].init));
    const keyOf = (st) => nl.map((e) => st[e.id]).join('|');

    const tryStates = (st) => {
      let f;
      try { f = solveFixed(net, ctx, st); } catch (err) { if (err instanceof CircuitError) return { ok: false }; throw err; }
      const changes = [];
      for (const e of nl) { const nx = DEV[e.type].check(f.sol, e, f.infos[e.id], st[e.id]); if (nx) changes.push([e.id, nx]); }
      return { ok: true, f, changes };
    };

    if (!nl.length) {
      let f;
      try { f = solveFixed(net, ctx, states); } catch (err) { throw singularMsg(err); }
      return collect(net, ctx, states, f);
    }

    const seen = new Set();
    let cur = Object.assign({}, states);
    for (let it = 0; it < 300; it++) {
      const r = tryStates(cur);
      if (!r.ok) break;
      if (!r.changes.length) return collect(net, ctx, cur, r.f);
      seen.add(keyOf(cur));
      let next = Object.assign({}, cur);
      r.changes.forEach(([id, st]) => (next[id] = st));
      if (seen.has(keyOf(next))) {
        let found = false;
        for (const [id, st] of r.changes) {
          next = Object.assign({}, cur); next[id] = st;
          if (!seen.has(keyOf(next))) { found = true; break; }
        }
        if (!found) break;
      }
      cur = next;
    }
    // Vét cạn mọi tổ hợp trạng thái (mạch nhỏ)
    const counts = nl.map((e) => DEV[e.type].states.length);
    const total = counts.reduce((a, b) => a * b, 1);
    if (total <= 200000) {
      const idx = new Array(nl.length).fill(0);
      for (let t = 0; t < total; t++) {
        const st = {};
        nl.forEach((e, i) => (st[e.id] = DEV[e.type].states[idx[i]]));
        const r = tryStates(st);
        if (r.ok && !r.changes.length) return collect(net, ctx, st, r.f);
        for (let i = 0; i < idx.length; i++) { idx[i]++; if (idx[i] < counts[i]) break; idx[i] = 0; }
      }
    }
    throw new CircuitError('Không tìm được trạng thái nhất quán cho các linh kiện phi tuyến (diode/BJT/op-amp). Kiểm tra lại cách nối mạch.');
  }

  function singularMsg(err) {
    if (err instanceof CircuitError && err.message === 'singular')
      return new CircuitError('Mạch không giải được: có vòng chỉ gồm nguồn áp / cuộn cảm (DC) / dây nối tắt, hoặc nguồn dòng bị hở mạch.');
    return err;
  }

  function analyze(net) {
    const out = { ok: true, error: null, warnings: [], dc: null, ac: [] };
    try {
      out.dc = solveDC(net, out.warnings);
    } catch (err) {
      out.ok = false;
      out.error = singularMsg(err).message;
      return out;
    }
    const freqs = [];
    for (const e of net.elements) {
      if ((e.type === 'ACV' || e.type === 'ACI') && e.p.f > 0 && !freqs.some((f) => Math.abs(f - e.p.f) < 1e-9)) freqs.push(e.p.f);
    }
    if (freqs.length > 1) out.warnings.push('Có nhiều tần số khác nhau: kết quả AC được tính riêng cho từng tần số (xếp chồng).');
    const hasNL = net.elements.some((e) => ['D', 'ZD', 'NPN', 'PNP'].includes(e.type));
    if (freqs.length && hasNL) out.warnings.push('Phân tích AC với diode/BJT dùng trạng thái DC (mô hình gần đúng).');
    for (const f of freqs) {
      const ctx = { ac: true, freq: f, omega: 2 * Math.PI * f };
      try {
        out.ac.push(collect(net, ctx, out.dc.states, solveFixed(net, ctx, out.dc.states)));
      } catch (err) {
        out.warnings.push('AC ' + f + ' Hz: ' + singularMsg(err).message);
      }
    }
    const big = out.dc.nodeV.some((v) => Math.abs(v.re) > 1e7);
    if (big) out.warnings.push('Có điện áp cực lớn: có thể nguồn dòng đang bị hở mạch hoặc nút bị bỏ lửng.');
    return out;
  }

  EC.solver = { analyze, DEV, STATE_NAMES, cx, cabs, cadd, csub, cmul, cdiv, polar };
})();
</script>

      value: (p) => '±' + p.Vpos + 'V',
      hint: 'Op-amp lý tưởng: dòng vào = 0, khi tuyến tính V+ = V−. Lật (F) để đổi chỗ chân + / −.',

    },
    LABEL: {
      label: 'Nhãn nút', prefix: 'A', group: 'Khác', pins: [[0, 0]], pinNames: ['nút'], box: [-0.5, -0.5, 0.5, 0.5],
      params: [], noLabel: true,
      draw: () => `<circle class="fill" cx="0" cy="0" r="3"/>`,
      hint: 'Đặt tên cho nút (ví dụ A, B, Vout). Các nhãn trùng tên được coi là nối với nhau.',
    },
  };

  function xf(c, lx, ly) {
    let x = lx, y = c.flip ? -ly : ly;
    for (let i = 0; i < ((c.rot || 0) & 3); i++) { const t = x; x = -y; y = t; }
    return { x: c.x + x, y: c.y + y };
  }
  function pinPositions(c) { return COMP[c.type].pins.map(([x, y]) => xf(c, x, y)); }
  function worldBox(c) {
    const b = COMP[c.type].box;
    const ps = [xf(c, b[0], b[1]), xf(c, b[2], b[3])];
    return { x1: Math.min(ps[0].x, ps[1].x), y1: Math.min(ps[0].y, ps[1].y), x2: Math.max(ps[0].x, ps[1].x), y2: Math.max(ps[0].y, ps[1].y) };
  }
  function defaults(type) {
    const p = {};
    COMP[type].params.forEach((d) => (p[d.k] = d.def));
    return p;
  }

  EC.G = G;
  EC.COMP = COMP;
  EC.xf = xf;
  EC.pinPositions = pinPositions;
  EC.worldBox = worldBox;
  EC.defaultParams = defaults;
})();

<script>
/* Chuyển bản vẽ (linh kiện + dây) thành danh sách nút cho bộ giải */
(function () {
  'use strict';
  const EC = (globalThis.EC = globalThis.EC || {});
  const key = (x, y) => x + ',' + y;

  class UF {
    constructor() { this.p = new Map(); }
    add(a) { if (!this.p.has(a)) this.p.set(a, a); }
    find(a) { this.add(a); let r = a; while (this.p.get(r) !== r) r = this.p.get(r); let c = a; while (this.p.get(c) !== r) { const n = this.p.get(c); this.p.set(c, r); c = n; } return r; }
    union(a, b) { const ra = this.find(a), rb = this.find(b); if (ra !== rb) this.p.set(ra, rb); }
  }

  function onInterior(p, w) {
    const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
    const cross = (p.x - w.x1) * dy - (p.y - w.y1) * dx;
    if (cross !== 0) return false;
    const dot = (p.x - w.x1) * dx + (p.y - w.y1) * dy;
    return dot > 0 && dot < dx * dx + dy * dy;
  }

  function build(model) {
    const COMP = EC.COMP, parse = EC.units.parseValue;
    const uf = new UF();
    const errors = [], warnings = [];
    const pts = [];
    const pinsOf = {};
    const count = new Map();
    const bump = (k, n) => count.set(k, (count.get(k) || 0) + n);
    for (const c of model.comps) {
      const ps = EC.pinPositions(c);
      pinsOf[c.id] = ps;
      ps.forEach((p) => { uf.add(key(p.x, p.y)); pts.push(p); bump(key(p.x, p.y), 1); });
    }
    for (const w of model.wires) {
      uf.union(key(w.x1, w.y1), key(w.x2, w.y2));
      pts.push({ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 });
      bump(key(w.x1, w.y1), 1); bump(key(w.x2, w.y2), 1);
    }
    const seenPt = new Set();
    for (const p of pts) {
      const k = key(p.x, p.y);
      if (seenPt.has(k)) continue;
      seenPt.add(k);
      for (const w of model.wires) if (onInterior(p, w)) { uf.union(k, key(w.x1, w.y1)); bump(k, 2); }
    }
    // Nhãn trùng tên -> nối với nhau
    const labelKey = {};
    for (const c of model.comps) if (c.type === 'LABEL') {
      const k = key(pinsOf[c.id][0].x, pinsOf[c.id][0].y);
      const nm = (c.name || '').trim();
      if (!nm) continue;
      if (labelKey[nm]) uf.union(labelKey[nm], k); else labelKey[nm] = k;
    }

    // Đánh số nút
    const rootNode = new Map();
    const nodeNames = ['GND'];
    const nodeRep = [null];
    const grounds = model.comps.filter((c) => c.type === 'GND');
    for (const g of grounds) { const r = uf.find(key(pinsOf[g.id][0].x, pinsOf[g.id][0].y)); rootNode.set(r, 0); if (!nodeRep[0]) nodeRep[0] = pinsOf[g.id][0]; }
    let refAuto = null;
    if (!grounds.length) {
      const src = model.comps.find((c) => ['V', 'ACV', 'I', 'ACI'].includes(c.type)) || model.comps.find((c) => COMP[c.type].pins.length > 1);
      if (src) {
        const p = pinsOf[src.id][src.type === 'V' || src.type === 'ACV' ? 1 : 0];
        rootNode.set(uf.find(key(p.x, p.y)), 0);
        nodeRep[0] = p;
        refAuto = src.name;
      }
    }
    for (const c of model.comps) {
      for (const p of pinsOf[c.id]) {
        const r = uf.find(key(p.x, p.y));
        if (!rootNode.has(r)) { rootNode.set(r, nodeNames.length); nodeNames.push('N' + nodeNames.length); nodeRep.push(p); }
      }
    }
    // Tên nút theo nhãn
    for (const c of model.comps) if (c.type === 'LABEL' && (c.name || '').trim()) {
      const n = rootNode.get(uf.find(key(pinsOf[c.id][0].x, pinsOf[c.id][0].y)));
      if (n > 0) nodeNames[n] = c.name.trim();
      else if (n === 0) nodeNames[0] = 'GND (' + c.name.trim() + ')';
    }
    // tránh trùng tên tự động với tên nhãn
    const used = new Set();
    nodeNames.forEach((nm, i) => { let n = nm, j = 2; while (used.has(n)) n = nm + '_' + j++; used.add(n); nodeNames[i] = n; });

    const nodeAt = (x, y) => {
      const k = key(x, y);
      if (uf.p.has(k)) { const r = rootNode.get(uf.find(k)); if (r !== undefined) return r; }
      for (const w of model.wires) if (onInterior({ x, y }, w)) { const r = rootNode.get(uf.find(key(w.x1, w.y1))); if (r !== undefined) return r; }
      return undefined;
    };

    const elements = [];
    const compNodes = {};
    for (const c of model.comps) {
      const def = COMP[c.type];
      const nodes = pinsOf[c.id].map((p) => rootNode.get(uf.find(key(p.x, p.y))));
      compNodes[c.id] = nodes;
      if (c.type === 'GND' || c.type === 'LABEL') continue;
      const p = {};
      let bad = false;
      for (const d of def.params) {
        if (d.type === 'bool') { p[d.k] = !!c.params[d.k]; continue; }
        const v = parse(c.params[d.k]);
        if (!isFinite(v)) { errors.push(`${c.name}: giá trị "${d.label}" không hợp lệ`); bad = true; }
        p[d.k] = v;
      }
      if (bad) continue;
      if ((c.type === 'C' && p.C <= 0) || (c.type === 'L' && p.L < 0) || (c.type === 'R' && p.R < 0)) { errors.push(`${c.name}: giá trị phải dương`); continue; }
      if ((c.type === 'V' || c.type === 'ACV') && nodes[0] === nodes[1]) { errors.push(`${c.name}: nguồn áp bị nối tắt hai cực`); continue; }
      pinsOf[c.id].forEach((pp, i) => { if ((count.get(key(pp.x, pp.y)) || 0) < 2) warnings.push(`${c.name}: chân ${def.pinNames[i]} chưa được nối`); });
      elements.push({ id: c.id, type: c.type, name: c.name, nodes, p });
    }
    if (refAuto && elements.length) warnings.push(`Chưa có GND: lấy cực âm của ${refAuto} làm mốc 0 V.`);

    return { net: { nodeCount: nodeNames.length, elements, nodeNames }, nodeNames, nodeRep, nodeAt, compNodes, pinsOf, count, errors, warnings, onInterior };
  }

  EC.netlist = { build, onInterior, key };
})();
</script>
<script>
/* Công cụ: phân tích một mô hình, tìm giá trị tham số (goal seek), quét tham số */
(function () {
  'use strict';
  const EC = (globalThis.EC = globalThis.EC || {});

  function run(model) {
    const b = EC.netlist.build(model);
    if (b.errors.length) return { build: b, result: { ok: false, error: b.errors.join('; '), warnings: [], ac: [] } };
    if (!b.net.elements.length) return { build: b, result: null };
    return { build: b, result: EC.solver.analyze(b.net) };
  }

  /* spec: { node: 'A' } hoặc { comp: 'R4' (tên), key: 'I' } ; mode: 'dc' | số tần số */
  function pickRes(result, mode) {
    if (!result || !result.ok) return null;
    if (mode === 'dc' || mode == null) return result.dc;
    return result.ac.find((r) => Math.abs(r.ctx.freq - mode) < 1e-9) || null;
  }

  function extract(model, run_, spec) {
    const { build, result } = run_;
    const r = pickRes(result, spec.mode);
    if (!r) return NaN;
    let v;
    if (spec.node != null) {
      const n = build.nodeNames.indexOf(spec.node);
      if (n < 0) return NaN;
      v = r.nodeV[n];
    } else {
      const c = model.comps.find((c) => c.name === spec.comp);
      if (!c || !r.el[c.id]) return NaN;
      v = r.el[c.id].q[spec.key];
    }
    if (v == null) return NaN;
    if (typeof v === 'number') return v;
    return spec.mode === 'dc' || spec.mode == null ? v.re : Math.hypot(v.re, v.im);
  }

  function signature(model, run_) {
    const r = run_.result;
    if (!r || !r.ok) return 'lỗi';
    const parts = [];
    for (const c of model.comps) { const st = r.dc.states[c.id]; if (st) parts.push(c.name + ':' + st); }
    return parts.join(', ');
  }

  function withParam(model, compName, param, x) {
    const m = JSON.parse(JSON.stringify(model));
    const c = m.comps.find((c) => c.name === compName);
    if (c) c.params[param] = String(x);
    return m;
  }

  function evalAt(model, compName, param, x, spec) {
    const m = withParam(model, compName, param, x);
    const r = run(m);
    return { value: extract(m, r, spec), sig: signature(m, r), run: r, model: m };
  }

  function goalSeek(o) {
    const { model, comp, param, spec, target } = o;
    const c = model.comps.find((c) => c.name === comp);
    const x0 = EC.units.parseValue(c.params[param]);
    let lo = o.min, hi = o.max, log;
    if (lo == null || hi == null || !isFinite(lo) || !isFinite(hi)) {
      if (x0 > 0) { lo = x0 / 1e5; hi = x0 * 1e5; } else { const s = Math.max(1, Math.abs(x0)) * 1000; lo = -s; hi = s; }
    }
    log = lo > 0 && hi > 0;
    const N = 400;
    const xs = [], fs = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = log ? lo * Math.pow(hi / lo, t) : lo + (hi - lo) * t;
      xs.push(x); fs.push(evalAt(model, comp, param, x, spec).value - target);
    }
    const brackets = [];
    let best = { x: NaN, f: Infinity };
    for (let i = 0; i <= N; i++) {
      if (isFinite(fs[i]) && Math.abs(fs[i]) < Math.abs(best.f)) best = { x: xs[i], f: fs[i] };
      if (i < N && isFinite(fs[i]) && isFinite(fs[i + 1]) && (fs[i] === 0 || fs[i] * fs[i + 1] < 0)) brackets.push(i);
    }
    const dist = (x) => (log && x0 > 0 ? Math.abs(Math.log(x / x0)) : Math.abs(x - x0));
    const roots = [];
    for (const i of brackets) {
      let a = xs[i], b = xs[i + 1], fa = fs[i];
      if (fa === 0) { roots.push(a); continue; }
      for (let it = 0; it < 100; it++) {
        const m = log ? Math.sqrt(a * b) : (a + b) / 2;
        const fm = evalAt(model, comp, param, m, spec).value - target;
        if (!isFinite(fm)) break;
        if (fm === 0) { a = b = m; break; }
        if (fa * fm < 0) b = m; else { a = m; fa = fm; }
      }
      const x = log ? Math.sqrt(a * b) : (a + b) / 2;
      const f = evalAt(model, comp, param, x, spec).value - target;
      if (Math.abs(f) <= 1e-6 * Math.max(1, Math.abs(target))) roots.push(x);
    }
    roots.sort((a, b) => dist(a) - dist(b));
    if (roots.length) {
      const x = roots[0];
      return { ok: true, x, roots, value: evalAt(model, comp, param, x, spec).value, range: [lo, hi] };
    }
    return { ok: false, best, range: [lo, hi] };
  }

  function sweep(o) {
    const { model, comp, param, from, to, steps, log, spec } = o;
    const pts = [];
    const n = Math.max(2, steps | 0);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = log ? from * Math.pow(to / from, t) : from + (to - from) * t;
      const r = evalAt(model, comp, param, x, spec);
      pts.push({ x, y: r.value, sig: r.sig });
    }
    const transitions = [];
    for (let i = 0; i < n; i++) {
      if (pts[i].sig === pts[i + 1].sig) continue;
      let a = pts[i].x, b = pts[i + 1].x;
      const sa = pts[i].sig;
      for (let it = 0; it < 80; it++) {
        const m = log ? Math.sqrt(a * b) : (a + b) / 2;
        if (evalAt(model, comp, param, m, spec).sig === sa) a = m; else b = m;
      }
      transitions.push({ x: log ? Math.sqrt(a * b) : (a + b) / 2, from: sa, to: pts[i + 1].sig });
    }
    return { pts, transitions };
  }

  EC.tools = { run, extract, goalSeek, sweep, evalAt, pickRes, signature };
})();
</script>

<h2>Hướng dẫn nhanh</h2>
<ol>
  <li><b>Đặt linh kiện:</b> bấm vào linh kiện ở cột trái rồi bấm lên lưới. Phím <code>R</code> xoay, <code>F</code> lật, <code>Esc</code> để thôi.</li>

  <li>Giá trị nhập được tiền tố: <code>5.5k</code> = 5500, <code>26,5m</code> = 0,0265, <code>6m</code>, <code>10u</code> (micro), <code>2M</code> (mega), <code>100n</code>, <code>22p</code>.</li>

</ol>
<h3>Quy ước dấu</h3>
<ul>
  <li><b>U</b> của linh kiện 2 chân = V(chân 1) − V(chân 2). <b>I</b> là dòng chảy từ chân 1 qua linh kiện sang chân 2.</li>
  <li><b>P &gt; 0</b>: linh kiện tiêu thụ. <b>P &lt; 0</b>: linh kiện phát công suất (thường là nguồn).</li>
  <li>Ở chế độ AC, mọi giá trị là <b>phasor hiệu dụng</b> (RMS), dạng độ lớn ∠ góc pha.</li>
</ul>

<h2>Bảng công thức</h2>
<h3>Mạch một chiều (DC)</h3>
<ul>
  <li>Định luật Ôm: <span class="f">U = I·R</span>. Công suất: <span class="f">P = U·I = I²R = U²/R</span></li>
  <li>Nối tiếp: <span class="f">R = R1 + R2 + …</span>. Song song: <span class="f">1/R = 1/R1 + 1/R2 + …</span>, hai điện trở thì <span class="f">R1·R2/(R1+R2)</span></li>
  <li>Phân áp: <span class="f">U2 = U·R2/(R1+R2)</span>. Phân dòng: <span class="f">I1 = I·R2/(R1+R2)</span></li>
  <li>Kirchhoff 1 (KCL): tổng dòng vào một nút = tổng dòng ra. Kirchhoff 2 (KVL): tổng điện áp quanh một vòng kín = 0</li>
  <li>Thevenin: thay phần mạch bằng <span class="f">Vth</span> (điện áp hở mạch) nối tiếp <span class="f">Rth</span> (điện trở nhìn vào khi tắt nguồn)</li>
  <li>Ở DC: tụ điện = hở mạch, cuộn cảm = ngắn mạch</li>
</ul>
<h3>Mạch xoay chiều (AC)</h3>
<ul>
  <li><span class="f">ω = 2πf</span>. <span class="f">X_L = ωL</span>, <span class="f">Z_L = jX_L</span>. <span class="f">X_C = 1/(ωC)</span>, <span class="f">Z_C = −jX_C</span></li>
  <li>Trở kháng nối tiếp và song song tính giống điện trở, nhưng bằng số phức. <span class="f">|Z| = √(R² + X²)</span>, <span class="f">φ = arctan(X/R)</span></li>
  <li>Giá trị hiệu dụng: <span class="f">U_hd = U_max/√2</span>. Định luật Ôm phức: <span class="f">I = U/Z</span></li>
  <li><span class="f">P = U·I·cosφ = I²R</span> (W). <span class="f">Q = U·I·sinφ</span> (var). <span class="f">S = U·I</span> (VA)</li>
</ul>
<h3>Ba pha (đấu Y cân bằng)</h3>
<ul>
  <li><span class="f">U_dây = √3·U_pha</span>, <span class="f">I_dây = I_pha</span>. Đấu Δ: <span class="f">I_dây = √3·I_pha</span></li>
  <li>Hệ cân bằng thì tính trên <b>một pha</b>: <span class="f">I = U_pha/|Z_dây + Z_tải|</span>. Dòng dây trung tính = 0</li>
  <li><span class="f">P = 3·U_pha·I·cosφ = √3·U_dây·I·cosφ</span></li>
</ul>
<h3>Diode</h3>
<ul>
  <li>Mô hình sụt áp hằng: dẫn thì <span class="f">U_D = Vf</span> (Si ≈ 0,7 V), tắt thì <span class="f">I = 0</span></li>
  <li>Cách giải: giả sử một trạng thái, tính mạch, rồi kiểm tra (dẫn thì phải có I &gt; 0, tắt thì phải có U &lt; Vf)</li>
  <li>Zener phân cực ngược ổn áp ở <span class="f">Vz</span> khi điện áp đặt vào ≥ Vz: <span class="f">I_Z = I_R(nối tiếp) − I_tải</span></li>
</ul>
<h3>Transistor BJT</h3>
<ul>
  <li><span class="f">I_E = I_B + I_C</span>. Vùng khuếch đại: <span class="f">I_C = β·I_B</span>, <span class="f">V_BE ≈ 0,7 V</span></li>
  <li>Mạch như Hình 6: <span class="f">I_B = (V_BB − V_BE)/R_B</span>, <span class="f">I_C(sat) = (V_CC − V_CE(sat))/R_C</span></li>
  <li>Bão hòa khi <span class="f">β·I_B ≥ I_C(sat)</span>, suy ra <span class="f">R_B ≤ β·(V_BB − V_BE)/I_C(sat)</span></li>
  <li>Công suất tiêu tán: <span class="f">P = V_CE·I_C + V_BE·I_B</span></li>
</ul>
<h3>Op-amp lý tưởng</h3>
<ul>
  <li>Dòng vào hai chân = 0. Khi có hồi tiếp âm và chưa bão hòa: <span class="f">V+ = V−</span> (ngắn mạch ảo)</li>
  <li>Đảo: <span class="f">Vout = −(R2/R1)·Vin</span>. Không đảo: <span class="f">Vout = (1 + R2/R1)·Vin</span></li>
  <li>Mạch trừ như Hình 7: <span class="f">Vout = −(R2/R1)·Vi1 + (1 + R2/R1)·Vi2</span></li>
  <li>Vout bị giới hạn trong khoảng nguồn nuôi (±Vcc), vượt quá thì bão hòa</li>
</ul>
<h3>Cách app giải mạch</h3>
<p>App dùng <b>phương pháp điện thế nút cải tiến (MNA)</b>, giống SPICE: viết phương trình KCL cho từng nút, thêm một phương trình cho mỗi nguồn áp, rồi giải hệ phương trình tuyến tính (số phức nếu là AC). Diode, BJT và op-amp được giải bằng cách thử lần lượt các trạng thái cho tới khi mọi điều kiện kiểm tra đều thoả, giống cách làm bằng tay trên giấy.</p>
`;
